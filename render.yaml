databases:
  - name: agrodirecto-db
    databaseName: agrodirecto
    user: agrodirecto
    plan: free
    region: oregon

services:
  - type: web
    name: agrodirecto-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: uvicorn main:app --app-dir scr --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agrodirecto-db
          property: connectionString
      - key: CLAVE_SECRETA
        generateValue: true
      - key: FRONTEND_URL
        value: https://agrodirecto-web.onrender.com
      - key: CORS_ORIGINS
        value: https://agrodirecto-web.onrender.com
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DOCUMENT_TYPE
        value: CC
      - key: ADMIN_DOCUMENT_NUMBER
        sync: false
      - key: ADMIN_PHONE
        sync: false

  - type: web
    name: agrodirecto-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://agrodirecto-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
